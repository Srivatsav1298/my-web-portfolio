<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#141422"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b9dc3"/>
      <stop offset="50%" stop-color="#c0c8d8"/>
      <stop offset="100%" stop-color="#e8ecf4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="400" cy="300" r="220" fill="#5b6b96" opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="180" cy="140" r="90" fill="#7a89ad" opacity="0.08" filter="url(#softGlow)"/>

  <!-- particles -->
  <g fill="#aab4cc">
    <circle cx="120" cy="420" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="150" r="2.5" opacity="0.4"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="430" r="2" opacity="0.45"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="180" r="1.8" opacity="0.35"/>
    <circle cx="640" cy="520" r="1.6" opacity="0.4"/>
    <circle cx="240" cy="90" r="1.6" opacity="0.3"/>
  </g>

  <!-- glass panel backdrop -->
  <rect x="230" y="110" width="340" height="380" rx="24" fill="url(#glass)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

  <!-- scales of justice -->
  <g transform="translate(400,235)" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- pole -->
    <line x1="0" y1="-70" x2="0" y2="70"/>
    <!-- base -->
    <line x1="-38" y1="78" x2="38" y2="78"/>
    <line x1="0" y1="70" x2="0" y2="78"/>
    <!-- beam -->
    <line x1="-85" y1="-55" x2="85" y2="-55"/>
    <circle cx="0" cy="-72" r="7" fill="url(#accent)" stroke="none"/>
    <!-- left pan -->
    <line x1="-85" y1="-55" x2="-105" y2="-5"/>
    <line x1="-85" y1="-55" x2="-65" y2="-5"/>
    <path d="M -115 -5 A 30 30 0 0 0 -55 -5" fill="rgba(192,200,216,0.25)" stroke-width="4"/>
    <!-- right pan -->
    <line x1="85" y1="-55" x2="105" y2="-5"/>
    <line x1="85" y1="-55" x2="65" y2="-5"/>
    <path d="M 55 -5 A 30 30 0 0 0 115 -5" fill="rgba(192,200,216,0.25)" stroke-width="4"/>
    <animateTransform attributeName="transform" type="rotate" values="-2 400 235; 2 400 235; -2 400 235" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- chat / answer lines (grounded citation doc) -->
  <g transform="translate(280,360)" fill="rgba(232,236,244,0.55)">
    <rect x="0" y="0" width="240" height="10" rx="5" fill="rgba(232,236,244,0.35)"/>
    <rect x="0" y="26" width="200" height="10" rx="5" fill="rgba(232,236,244,0.25)"/>
    <rect x="0" y="52" width="160" height="10" rx="5" fill="rgba(232,236,244,0.18)"/>
    <!-- citation chips -->
    <rect x="0" y="82" width="52" height="20" rx="10" fill="rgba(139,157,195,0.35)" stroke="rgba(192,200,216,0.5)" stroke-width="1"/>
    <text x="26" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#dfe5f0" text-anchor="middle">§ 15-1</text>
    <rect x="60" y="82" width="52" height="20" rx="10" fill="rgba(139,157,195,0.35)" stroke="rgba(192,200,216,0.5)" stroke-width="1"/>
    <text x="86" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#dfe5f0" text-anchor="middle">§ 15-3</text>
  </g>

  <!-- title -->
  <text x="400" y="540" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2" fill="url(#accent)" text-anchor="middle">REGELVERK COPILOT</text>
  <text x="400" y="566" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="rgba(170,180,204,0.75)" text-anchor="middle">GROUNDED NORWEGIAN EMPLOYMENT LAW AI</text>
</svg>
